logLevel: info
rtsp: true
rtspAddress: :8554
webrtc: true
webrtcAddress: :8889
webrtcLocalUDPAddress: :8189
api: true
apiAddress: :9997
authInternalUsers:
  # Control API hanya tersedia di network Docker internal (port 9997 tidak dipublish).
  - user: any
    permissions:
      - action: playback
      - action: api

# Ganti IP, username, password, dan path sesuai kamera/NVR.
# Nama path harus sama dengan "Stream path" di dashboard.
# Gunakan substream H.264 untuk tampilan grid agar client tetap ringan.
paths:
  gerbang-utama:
    source: rtsp://viewer:CHANGE_ME@192.168.10.21:554/Streaming/Channels/102
    sourceOnDemand: true
  parkir-depan:
    source: rtsp://viewer:CHANGE_ME@192.168.10.22:554/Streaming/Channels/102
    sourceOnDemand: true

  # Path Wisenet dikelola dashboard dari PostgreSQL melalui Control API internal.
