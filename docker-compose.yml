services:
  dashboard:
    build: .
    restart: unless-stopped
    environment:
      PORT: 8080
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL in .env}
      DATABASE_POOL_MAX: ${DATABASE_POOL_MAX:-10}
      DATABASE_SSL: ${DATABASE_SSL:-false}
      SESSION_TTL_HOURS: 12
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Set ADMIN_PASSWORD in .env}
      SECURE_COOKIES: ${SECURE_COOKIES:-false}
      MEDIAMTX_WEBRTC_BASE: http://${SERVER_LAN_IP:-10.8.140.67}:8889
      MEDIAMTX_API_BASE: http://mediamtx:9997
      RTSP_ENCRYPTION_KEY: ${RTSP_ENCRYPTION_KEY:?Set RTSP_ENCRYPTION_KEY in .env}
      NVR_BASE_URL: ${NVR_BASE_URL:-}
      NVR_RTSP_HOST: ${NVR_RTSP_HOST:-}
      NVR_RTSP_PORT: ${NVR_RTSP_PORT:-554}
      NVR_USERNAME: ${NVR_USERNAME:-}
      NVR_PASSWORD: ${NVR_PASSWORD:-}
      PLAYBACK_SESSION_TTL_MINUTES: ${PLAYBACK_SESSION_TTL_MINUTES:-120}
    ports:
      - "8080:8080"
    depends_on:
      - mediamtx

  mediamtx:
    build:
      context: .
      dockerfile: deploy/Dockerfile.mediamtx
    image: sentra-cctv-mediamtx:local
    restart: unless-stopped
    environment:
      # Advertise IP host, bukan IP internal container, sebagai ICE candidate WebRTC.
      MTX_WEBRTCADDITIONALHOSTS: ${SERVER_LAN_IP:-10.8.140.67}
    ports:
      - "8554:8554"
      - "8889:8889"
      - "8189:8189"
      - "8189:8189/udp"